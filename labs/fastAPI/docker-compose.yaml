services:
  postgres:
    image: postgres:16.9
    environment:
      - POSTGRES_DB=${DB_NAME:-mydatabase}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret}
      - POSTGRES_USER=${DB_USERNAME:-myuser}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-myuser} -d ${DB_NAME:-mydatabase}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: api-fast-api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
